<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SinchAI - Login</title>
  <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
  <header>
    <h1><img src="/images/logo.png" alt="">SinchAI Smart Irrigation</h1>
    <nav><a href="/">Sign Up</a><a href="/login">Login</a><a href="/about.html">About</a><a href="/gallery.html">Gallery</a><a href="/supervisors.html">Supervisors</a></nav>
  </header>
  <div class="card">
    <h2>Login</h2>
    <form action="/login" method="POST">
      <label for="mobile">Mobile number</label>
      <input id="mobile" name="mobile" type="tel" placeholder="9876543210" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Login</button>
    </form>
    <p class="small">New here? <a href="/">Create an account</a></p>
  </div>
</body>
</html>
