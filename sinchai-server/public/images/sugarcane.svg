<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sugarcane stalks with a water drop">
  <rect width="200" height="200" rx="24" fill="#e8f5e9"/>
  <!-- three sugarcane stalks with nodes -->
  <g stroke="#00602b" stroke-width="9" stroke-linecap="round">
    <line x1="62" y1="176" x2="52" y2="62"/>
    <line x1="92" y1="176" x2="92" y2="46"/>
    <line x1="122" y1="176" x2="134" y2="70"/>
  </g>
  <g stroke="#7fbf8a" stroke-width="3">
    <line x1="56" y1="150" x2="68" y2="150"/><line x1="55" y1="120" x2="67" y2="120"/><line x1="54" y1="90" x2="66" y2="90"/>
    <line x1="86" y1="152" x2="98" y2="152"/><line x1="86" y1="122" x2="98" y2="122"/><line x1="86" y1="92" x2="98" y2="92"/><line x1="86" y1="64" x2="98" y2="64"/>
    <line x1="116" y1="150" x2="128" y2="150"/><line x1="118" y1="120" x2="130" y2="120"/><line x1="120" y1="92" x2="132" y2="92"/>
  </g>
  <!-- leaves -->
  <g fill="#1b7a3e">
    <path d="M52 62 C 30 50, 18 30, 14 14 C 38 20, 54 38, 52 62 Z"/>
    <path d="M92 46 C 78 26, 80 10, 92 -2 C 104 10, 106 26, 92 46 Z" transform="translate(0 6)"/>
    <path d="M134 70 C 150 50, 170 42, 188 44 C 178 62, 158 74, 134 70 Z"/>
  </g>
  <!-- water drop -->
  <path d="M164 108 C 164 108, 144 132, 144 146 a20 20 0 0 0 40 0 C 184 132, 164 108, 164 108 Z" fill="#2a7fb8"/>
  <path d="M156 146 a8 8 0 0 0 8 8" fill="none" stroke="#bfe3f7" stroke-width="3" stroke-linecap="round"/>
</svg>
